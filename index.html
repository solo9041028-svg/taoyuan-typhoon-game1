<style>
:root{--bg:#0b1020;--ink:#f5f7ff;--muted:#aab6d1;--cyan:#62e8ff;--yellow:#ffd166;--green:#72f1b8;--red:#ff7474}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#233c68 0,transparent 38%),radial-gradient(circle at 100% 25%,#43234f 0,transparent 32%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:20px 14px 36px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.tag{font-size:12px;color:var(--cyan);letter-spacing:.12em;font-weight:800}.pill{border:1px solid #405174;border-radius:99px;padding:7px 10px;color:var(--muted);font-size:12px}h1{font-size:clamp(27px,7vw,44px);line-height:1.08;margin:10px 0 12px;letter-spacing:-.04em}.hero{padding:24px 20px;border:1px solid #344466;border-radius:24px;background:linear-gradient(140deg,#172744ef,#221934ed);box-shadow:0 20px 60px #0005;overflow:hidden;position:relative}.hero:after{content:"🌀";position:absolute;right:8px;top:8px;font-size:82px;opacity:.14}.hero p{color:var(--muted);line-height:1.7;margin:0;max-width:560px;position:relative;z-index:1}.hero h1,.hero .tag{position:relative;z-index:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.stat{background:#151d32;border:1px solid #2b3857;border-radius:16px;padding:12px}.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.stat strong{font-size:21px}.bar{height:5px;background:#2c3853;border-radius:10px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;width:50%;background:var(--cyan);transition:width .4s}.card{background:linear-gradient(150deg,#172139,#121a2e);border:1px solid #30405f;border-radius:22px;padding:20px;margin-top:14px;box-shadow:0 12px 35px #0002}.roundline{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:13px}.roundline b{color:var(--yellow)}h2{font-size:23px;line-height:1.25;margin:13px 0 8px}.story{color:#d5def3;line-height:1.75;font-size:15px}.choices{display:grid;gap:10px;margin-top:18px}.choice{display:block;width:100%;text-align:left;background:#1b2844;border:1px solid #3b4c70;border-radius:15px;padding:15px;color:var(--ink);font-size:15px;line-height:1.5;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}.choice:hover{border-color:var(--cyan);background:#223456;transform:translateY(-1px)}.choice b{display:block;color:var(--cyan);font-size:15px;margin-bottom:4px}.choice span{display:block;color:var(--muted);font-size:13px}.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.btn{border:1px solid #435477;background:#263553;color:var(--ink);padding:11px 14px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--cyan);color:#081322;border-color:var(--cyan)}.btn:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:14px;border-radius:14px;background:#0d1629;border:1px solid #30405b;padding:14px;line-height:1.65;white-space:pre-line;animation:pop .28s ease}.feedback strong{color:var(--yellow)}.hidden{display:none!important}.notice{font-size:12px;color:var(--muted);line-height:1.6;margin-top:15px}.footer{text-align:center;color:#7e8bab;font-size:12px;margin-top:22px}.flash{animation:flash .45s ease}.shake{animation:shake .35s ease}.result{text-align:center}.grade{font-size:62px;font-weight:950;letter-spacing:-.06em;color:var(--yellow);text-shadow:0 0 30px #ffd16644}.bigemoji{font-size:50px;animation:float 2s ease-in-out infinite}.result h2{font-size:27px}.result p{line-height:1.8;color:#d5def3}.resultbox{background:#10182b;border:1px solid #344466;border-radius:17px;padding:15px;margin-top:15px;text-align:left}.resultbox div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #283552}.resultbox div:last-child{border:0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f5f7ff;color:#111827;padding:11px 15px;border-radius:99px;font-weight:800;font-size:13px;box-shadow:0 8px 30px #0006;z-index:5;max-width:90%;text-align:center}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}@keyframes flash{0%{box-shadow:0 0 0 0 #62e8ff66}100%{box-shadow:0 0 0 18px transparent}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@media(min-width:600px){.wrap{padding-top:32px}.hero{padding:30px}.card{padding:24px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="tag">TAOYUAN · TYPHOON LEAVE SIMULATOR</div><div style="font-weight:800;margin-top:4px">桃園市長生存戰</div></div><div class="pill" id="soundPill">🔊 音效開啟</div></div>
<section class="hero"><div class="tag">HARD MODE · 7 ROUNDS</div><h1>桃園颱風假模擬器<br>市長，今晚你敢不敢？</h1><p>你只有七次決策機會。風雨、民怨、交通、網路聲量一起爆表。放假被罵、不放也被罵——你的任務不是討好所有人，而是活到結局。</p><div class="btnrow"><button class="btn primary" id="startBtn">開始市長生存戰 →</button><button class="btn" id="soundBtn">🔊 音效：開</button></div></section>
<div class="stats"><div class="stat"><small>市民信任</small><strong id="trust">50</strong><div class="bar"><span id="trustBar"></span></div></div><div class="stat"><small>災害風險</small><strong id="risk">30</strong><div class="bar"><span id="riskBar"></span></div></div><div class="stat"><small>決策分數</small><strong id="score">0</strong><div class="bar"><span id="scoreBar"></span></div></div></div>
<section class="card hidden" id="gameCard"><div class="roundline"><span id="roundLabel">第 1 / 7 回合</span><b id="phaseLabel">暴風雨前夕</b></div><h2 id="question"></h2><div class="story" id="story"></div><div class="choices" id="choices"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="btnrow"><button class="btn primary hidden" id="nextBtn">下一回合 →</button></div></section>
<section class="card result hidden" id="resultCard" aria-live="polite"></section><div class="footer">純屬娛樂的決策遊戲，不代表真實颱風假判斷。實際停班停課請以桃園市政府正式公告為準。</div></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const rounds=[
{phase:'暴風雨前夕',q:'晚上 8 點，氣象群組開始瘋傳「桃園明天一定放假」。你怎麼辦？',s:'氣象資料還在更新，社群已經先替你宣布放假。記者正在打電話，市民正在截圖。',c:[['A｜先開記者會，說明評估標準','透明溝通，可能被嫌講太多。',{trust:8,risk:-2,score:10}],['B｜先不說話，等最新預報','保留彈性，但網路會自己腦補。',{trust:-5,risk:2,score:3}],['C｜發文：我也在等天氣幫我決定','迷因效果拉滿，公務體系心臟停止。',{trust:2,risk:1,score:5,chaos:1}]]},
{phase:'第一波雨帶',q:'晚間雨勢突然增強，山區回報道路開始積水。',s:'你收到三個訊息：消防局說要注意、里長說雨超大、網友說「我家窗戶還沒濕」。',c:[['A｜啟動跨局處應變，先查高風險區','先把安全資訊補齊，犧牲一點速度。',{trust:6,risk:-9,score:10}],['B｜只看全市平均雨量','平均很漂亮，但局部可能很狼狽。',{trust:-6,risk:8,score:0}],['C｜請里長拍短影音回報','很接地氣，但別讓拍片取代救災。',{trust:3,risk:-3,score:7,chaos:1}]]},
{phase:'交通大考驗',q:'凌晨 5 點，通勤路線有淹水回報，捷運與公車也可能受影響。',s:'上班族問「到底要不要出門？」家長問「小孩送到學校會不會有事？」',c:[['A｜同步公布交通風險與替代方案','資訊清楚，讓大家能提早安排。',{trust:7,risk:-8,score:10}],['B｜只公告停班停課結果','公告有了，但民眾仍不知道路況。',{trust:-2,risk:4,score:4}],['C｜叫大家自己看導航','導航不是防災指揮中心啊！',{trust:-8,risk:7,score:-2,chaos:1}]]},
{phase:'放假與否的地獄題',q:'預報顯示風雨可能達標，但各區狀況不一致。',s:'放假：有人說你太早。上班：有人說你不顧安全。你必須依法依據預報與實際狀況審慎評估。',c:[['A｜依規定與最新預報審慎評估，說明理由','以安全和規範為主，不用猜網路風向。',{trust:8,risk:-7,score:12}],['B｜看留言區哪邊聲音比較大','留言數不是氣象數據。',{trust:-7,risk:5,score:-2,chaos:1}],['C｜先把通勤風險高的資訊講清楚，再公布決策','減少資訊落差，但要快速協調。',{trust:6,risk:-5,score:9}]]},
{phase:'網路炎上',q:'你做出決定後，網路兩派開戰，熱門留言是：「市長是不是看股市決定放假？」',s:'貼文分享數暴增。幕僚遞來三種回覆草稿，最上面那份還有錯字。',c:[['A｜公布判斷依據、資料時間與安全提醒','拿事實說話，可能不夠娛樂，但比較可靠。',{trust:8,risk:-2,score:10}],['B｜回嗆：不爽不要上班','五秒鐘很爽，五天新聞很長。',{trust:-12,risk:2,score:-5,chaos:2}],['C｜用一張梗圖解釋，但附上正式資訊','幽默可以降溫，重要資訊不能缺席。',{trust:4,risk:-1,score:8,chaos:1}]]},
{phase:'凌晨突發事件',q:'最新警報更新：某些區域風雨可能比原先預期更嚴重。',s:'此刻最重要的是確認第一線安全、調整應變部署，並避免散播未證實訊息。',c:[['A｜立即更新風險資訊並部署救援資源','安全優先，並清楚交代資訊更新時間。',{trust:7,risk:-12,score:12}],['B｜為了不被說反覆，維持原公告不變','面子不該比風險重要。',{trust:-9,risk:12,score:-5}],['C｜要求第一線回報，設定短時間內再次評估','有節奏地更新，避免空等。',{trust:5,risk:-7,score:9}]]},
{phase:'最終結局',q:'天亮了。你要向全市民交代這一夜的決策。',s:'記者會直播中，市民看著你的總分、信任值與風險值。最後一題，決定你是英雄、迷因，還是下一個梗。',c:[['A｜公開檢討：做對什麼、哪裡要改','願意負責，比裝完美更有說服力。',{trust:8,risk:-3,score:12}],['B｜宣布一切都是氣象局的問題','公關部門現在想離職。',{trust:-10,risk:4,score:-4,chaos:2}],['C｜整理成時間軸，承諾改善通報流程','把經驗變成下一次更好的準備。',{trust:6,risk:-5,score:10}]]}
];
const events=[{t:'📱 市民截圖你的舊貼文，翻出三年前的「今天好熱」',trust:-3,score:1},{t:'🧋 幕僚送來珍奶：甜度正常，公關危機加倍',trust:1,score:2},{t:'🦆 一隻鴨子在直播背景走過，網路開始封牠為副市長',trust:2,score:2},{t:'📡 氣象圖更新了！你沒有亂傳未證實消息，獲得尊重',trust:3,risk:-3,score:3},{t:'🗣️ 里長語音長達 4 分 37 秒，重點在最後 6 秒',trust:-1,score:1},{t:'🐈 機關吉祥物貓咪踩到鍵盤，差點把草稿發出去',trust:0,risk:1,score:2},{t:'🧑‍💻 網友做出你的迷因圖，意外幫忙傳播防災資訊',trust:3,risk:-2,score:3}];
let state=null,current=0,soundOn=true,audioCtx=null,answered=false;const $=id=>document.getElementById(id);const clamp=(n,min=0,max=100)=>Math.max(min,Math.min(max,n));
function sound(type='click'){if(!soundOn)return;try{audioCtx ||= new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime,notes=type==='win'?[523,659,784]:type==='bad'?[220,180]:type==='event'?[440,660]:[540];notes.forEach((n,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.setValueAtTime(n,now+i*.1);g.gain.setValueAtTime(.0001,now+i*.1);g.gain.exponentialRampToValueAtTime(.07,now+i*.1+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.16);o.start(now+i*.1);o.stop(now+i*.1+.18)})}catch(e){}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)}
function updateStats(){$('trust').textContent=state.trust;$('risk').textContent=state.risk;$('score').textContent=state.score;$('trustBar').style.width=state.trust+'%';$('riskBar').style.width=state.risk+'%';$('scoreBar').style.width=clamp(state.score,0,100)+'%';$('trustBar').style.background=state.trust<30?'var(--red)':'var(--cyan)';$('riskBar').style.background=state.risk>65?'var(--red)':'var(--yellow)';$('scoreBar').style.background=state.score<0?'var(--red)':'var(--green)'}
function start(){state={trust:50,risk:30,score:0,chaos:0,history:[]};current=0;answered=false;$('resultCard').classList.add('hidden');$('gameCard').classList.remove('hidden');$('startBtn').textContent='重新開始市長生存戰';updateStats();renderRound();sound();$('gameCard').scrollIntoView({behavior:'smooth',block:'start'})}
function renderRound(){answered=false;const r=rounds[current];$('roundLabel').textContent=`第 ${current+1} / ${rounds.length} 回合`;$('phaseLabel').textContent=r.phase;$('question').textContent=r.q;$('story').textContent=r.s;$('choices').replaceChildren();$('feedback').classList.add('hidden');$('nextBtn').classList.add('hidden');$('nextBtn').textContent=current===rounds.length-1?'查看最終結局 →':'下一回合 →';r.c.forEach((c,i)=>{const b=document.createElement('button');b.className='choice';const title=document.createElement('b');title.textContent=c[0];const desc=document.createElement('span');desc.textContent=c[1];b.append(title,desc);b.addEventListener('click',()=>choose(i));$('choices').append(b)})}
function choose(i){if(answered)return;answered=true;sound();const r=rounds[current],choice=r.c[i],d=choice[2];state.trust=clamp(state.trust+d.trust);state.risk=clamp(state.risk+d.risk);state.score+=d.score;state.chaos+=d.chaos||0;let msg=choice[1];if(Math.random()<.72){const e=events[Math.floor(Math.random()*events.length)];state.trust=clamp(state.trust+(e.trust||0));state.risk=clamp(state.risk+(e.risk||0));state.score+=e.score||0;msg+='\n\n隨機事件：'+e.t;sound('event')}state.history.push(choice[0]);[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(i===j)b.classList.add('flash')});updateStats();$('feedback').replaceChildren();const strong=document.createElement('strong');strong.textContent='決策結果：';const body=document.createElement('span');body.textContent=msg;$('feedback').append(strong,body);$('feedback').classList.remove('hidden');$('nextBtn').classList.remove('hidden');if(state.trust<20||state.risk>90)$('gameCard').classList.add('shake');else $('gameCard').classList.remove('shake')}
function finish(){$('gameCard').classList.add('hidden');const el=$('resultCard');el.classList.remove('hidden');let grade,title,emoji,desc;if(state.risk>=85){[grade,title,emoji,desc]=['F','防災系統紅色警報','🚨','風險值爆表！你可能把危機處理成了危機連續劇。下一次先把安全資訊與應變部署做好。']}else if(state.trust>=75&&state.risk<=35&&state.score>=55){[grade,title,emoji,desc]=['S','桃園守護神','🦸','你兼顧了安全、透明與決策品質。市民未必每個人都同意，但至少知道你為什麼這樣做。']}else if(state.chaos>=4){[grade,title,emoji,desc]=['M','迷因市長：流量就是政績？','🌀','你的迷因傳遍全台，市府小編拿到年度獎金，但幕僚的白髮也多了三根。']}else if(state.trust<25){[grade,title,emoji,desc]=['D','留言區的公敵','📉','信任值掉到谷底。別只顧著發公告，也要把依據、風險和替代方案講清楚。']}else if(state.score>=45&&state.risk<=55){[grade,title,emoji,desc]=['A','穩健應變派','🛡️','你不是最會製造話題的人，但大多數決策有顧到安全與溝通。這是很能打的成績。']}else if(state.chaos>=2){[grade,title,emoji,desc]=['B','桃園迷因製造機','😂','市民記住了你，可能也記住了你的發文。下次把幽默和正式防災資訊綁在一起。']}else{[grade,title,emoji,desc]=['C','差一點就穩了','🌧️','你撐過這一夜，但仍有幾個決策可以更好。先補足風險資訊，再把溝通做清楚。']}const share=`🌪️ 桃園颱風假模擬器｜市長生存戰\n我的評級：${grade}｜${title}\n決策分數：${state.score}｜市民信任：${state.trust}｜災害風險：${state.risk}\n你敢來挑戰嗎？`;el.replaceChildren();el.innerHTML=`<div class="bigemoji">${emoji}</div><div class="tag">FINAL REPORT</div><div class="grade">${grade}</div><h2>${title}</h2><p>${desc}</p><div class="resultbox"><div><span>決策分數</span><b>${state.score}</b></div><div><span>市民信任</span><b>${state.trust} / 100</b></div><div><span>災害風險</span><b>${state.risk} / 100</b></div><div><span>迷因事件累積</span><b>${state.chaos}</b></div></div><div class="btnrow" style="justify-content:center"><button class="btn primary" id="shareBtn">分享我的結局 ↗</button><button class="btn" id="againBtn">再玩一次</button></div><div class="notice" style="text-align:left">你的決策紀錄：<br>${state.history.map((a,i)=>`${i+1}. ${a}`).join('<br>')}</div>`;$('shareBtn').addEventListener('click',async()=>{try{if(navigator.share)await navigator.share({title:'桃園颱風假模擬器',text:share});else if(navigator.clipboard){await navigator.clipboard.writeText(share);toast('結局已複製，可以貼到 LINE！')}else toast(share)}catch(e){}});$('againBtn').addEventListener('click',start);sound(state.trust>=65&&state.risk<=45?'win':'bad');el.scrollIntoView({behavior:'smooth',block:'start'})}
$('startBtn').addEventListener('click',start);$('nextBtn').addEventListener('click',()=>{current++;if(current>=rounds.length)finish();else{renderRound();sound();$('gameCard').scrollIntoView({behavior:'smooth',block:'start'})}});$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊 音效：開':'🔇 音效：關';$('soundPill').textContent=soundOn?'🔊 音效開啟':'🔇 音效關閉';if(soundOn)sound('event')});updateStats();
})();
</script></body></html>
